name: CD

on:
  push:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsCDKDeployRole
          aws-region: us-east-1
        continue-on-error: true # While credentials are not set up
      - name: CDK Synth
        run: |
          cd infrastructure/cdk
          npm install
          npx cdk synth
      - name: CDK Deploy (Dry Run)
        run: echo "Skipping actual deploy until OIDC is fully configured"
