name: Security

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run npm audit
        run: npm audit --audit-level=high || echo "Ignoring audit failures for now"
      - name: Run pip audit
        run: |
          python -m pip install pip-audit
          pip-audit || echo "Ignoring pip audit failures for now"
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
