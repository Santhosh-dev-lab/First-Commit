[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physica-compiler"
version = "0.1.0"
description = "PHYSICA - A Compiler for Physical Reality"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy"
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
strict = true

[tool.hatch.build.targets.wheel]
packages = [
    "compiler",
    "simulation",
    "twin"
]
